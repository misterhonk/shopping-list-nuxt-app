name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Temporär deaktiviert für Phase 1, wird in Phase 2 wieder aktiviert
      # - name: Lint
      #   run: npm run lint

      # Temporär deaktiviert für Phase 1, wird in Phase 2 wieder aktiviert
      # - name: Check formatting
      #   run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # Temporär deaktiviert für Phase 1, wird in Phase 2 wieder aktiviert
