version: "3.8"

services:
  shopping-list-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping-list-app
    restart: unless-stopped
    ports:
      - "3000:3000"  # Host-Port:Container-Port
    # Hier könnten bei Bedarf Volumes für persistente Daten hinzugefügt werden
    environment:
      - NODE_ENV=production
    networks:
      - shopping-list-network

networks:
  shopping-list-network:
    driver: bridge
